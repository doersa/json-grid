<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Table Split View</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --line: #e5e7eb;
      --muted: #6b7280;
      --text: #111827;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --red: #b91c1c;
      --green: #166534;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      --left-pane-width: 25vw;
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(220px, var(--left-pane-width, 25vw)) 8px minmax(320px, 1fr);
      min-width: 900px;
      transition: grid-template-columns .18s ease;
    }

    .app.input-collapsed {
      grid-template-columns: 0 28px minmax(0, 1fr);
    }

    .input-pane,
    .table-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .input-pane {
      overflow: hidden;
      background: var(--panel);
    }

    .app.input-collapsed .input-pane {
      pointer-events: none;
    }

    .split-resizer {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 58px;
      background: linear-gradient(90deg, transparent 0, transparent 2px, #d8dee9 2px, #d8dee9 6px, transparent 6px);
      cursor: col-resize;
      touch-action: none;
      transition: background .14s ease;
    }

    .app.input-collapsed .split-resizer {
      cursor: default;
      background: #eef2ff;
    }

    .split-resizer::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 42px;
      border-radius: 999px;
      background: #aeb8c7;
      transform: translate(-50%, -50%);
      opacity: .75;
      transition: height .14s ease, background .14s ease, opacity .14s ease;
    }

    .split-resizer:hover::after,
    .split-resizer.active::after {
      height: 72px;
      background: var(--blue);
      opacity: 1;
    }

    .app.input-collapsed .split-resizer::after {
      opacity: 0;
    }

    body.resizing-layout {
      cursor: col-resize;
      user-select: none;
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
    }

    .brand {
      margin-right: auto;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .subbrand {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    button {
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 7px 10px;
      color: #374151;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    button:hover { background: #f3f4f6; }

    button.primary {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    button.primary:hover { background: #1d4ed8; }

    .input-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      color: var(--muted);
      background: #f9fafb;
      border-bottom: 1px solid #eef0f3;
      font-size: 12px;
    }

    .status {
      margin-left: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status.ok { color: var(--green); }
    .status.error { color: var(--red); }

    textarea {
      flex: 1;
      min-height: 0;
      width: 100%;
      resize: none;
      border: 0;
      outline: none;
      padding: 14px;
      color: #0f172a;
      background: #fff;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      tab-size: 2;
    }

    .table-pane { background: #fff; }

    .preview-head {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .preview-title { font-weight: 750; }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    .pane-toggle {
      position: relative;
      z-index: 2;
      width: 24px;
      height: 40px;
      padding: 0;
      border-color: #bfdbfe;
      border-radius: 999px;
      color: var(--blue);
      background: #fff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .16);
      font-size: 13px;
      line-height: 1;
    }

    .pane-toggle:hover {
      background: #dbeafe;
    }

    .app.input-collapsed .pane-toggle {
      width: 22px;
      height: 58px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      border-radius: 10px;
      font-size: 12px;
    }

    textarea.locating {
      animation: locatePulse .6s ease;
    }

    iframe.locating {
      outline: 2px solid rgba(37, 99, 235, .35);
      outline-offset: -2px;
    }

    @keyframes locatePulse {
      0% { background: #fff7ed; }
      100% { background: #fff; }
    }

    iframe {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #fff;
    }

    .error-preview {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--red);
      background: #fff7f7;
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="input-pane">
      <div class="topbar">
        <div class="brand">JSON Input <span class="subbrand">→ Table</span></div>
        <button id="formatBtn">格式化</button>
        <button id="minifyBtn">压缩</button>
        <button id="sampleBtn">示例</button>
        <button id="clearBtn">清空</button>
        <button id="renderBtn" class="primary">渲染</button>
      </div>
      <div class="input-head">
        <span>左侧输入 JSON，右侧实时显示表格</span>
        <span id="status" class="status">等待输入</span>
      </div>
      <textarea id="jsonInput" spellcheck="false" placeholder='{"hello":"world"}'></textarea>
    </section>

    <div id="splitResizer" class="split-resizer" title="拖拽调整左右宽度" role="separator" aria-label="调整左右面板宽度">
      <button id="paneToggleBtn" class="pane-toggle" type="button" title="隐藏左侧 JSON">‹</button>
    </div>

    <section class="table-pane">
      <div class="preview-head">
        <span class="preview-title">JSON Table</span>
        <span class="hint">支持过滤、排序、展开、复制、根路径切换；单击单元格可定位左侧 JSON</span>
      </div>
      <iframe id="preview" sandbox="allow-scripts allow-downloads"></iframe>
    </section>
  </div>

  <script>
    const visualizerScript = "let raw = pm.response.text();\n\ntry {\n  const root = pm.response.json();\n  const payload = root && Object.prototype.hasOwnProperty.call(root, \"DATA\")\n    ? root.DATA\n    : root && Object.prototype.hasOwnProperty.call(root, \"data\")\n      ? root.data\n      : root;\n\n  raw = JSON.stringify(payload, null, 2);\n} catch (e) {}\n\nconst template = `\n<style>\n  html, body {\n    margin: 0;\n    height: 100%;\n    font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Arial, sans-serif;\n  }\n\n  .app {\n    height: 100vh;\n    display: flex;\n    flex-direction: column;\n    background: #f7f8fb;\n    color: #172033;\n  }\n\n  .bar {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    padding: 10px 12px;\n    background: #fff;\n    border-bottom: 1px solid #e5e7eb;\n  }\n\n  .title {\n    font-weight: 700;\n  }\n\n  .meta {\n    margin-right: auto;\n    color: #6b7280;\n    font-size: 12px;\n  }\n\n  .meta-path {\n    display: inline-flex;\n    align-items: center;\n    gap: 2px;\n  }\n\n  .meta-path-btn {\n    border: 0;\n    background: transparent;\n    padding: 0 2px;\n    color: #2563eb;\n    font: inherit;\n    cursor: pointer;\n  }\n\n  .meta-path-btn:hover {\n    text-decoration: underline;\n    background: transparent;\n  }\n\n  .meta-path-sep {\n    color: #9ca3af;\n  }\n\n  .search {\n    width: 260px;\n    border: 1px solid #d1d5db;\n    border-radius: 8px;\n    padding: 7px 10px;\n  }\n\n  button {\n    border: 1px solid #d1d5db;\n    background: #fff;\n    border-radius: 8px;\n    padding: 7px 10px;\n    cursor: pointer;\n  }\n\n  button:hover {\n    background: #f3f4f6;\n  }\n\n  .settings-wrap {\n    position: relative;\n  }\n\n  .settings-btn {\n    width: 34px;\n    height: 34px;\n    padding: 0;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: 10px;\n    color: #4b5563;\n    background: #fff;\n    transition: background .14s ease, border-color .14s ease, color .14s ease, box-shadow .14s ease;\n  }\n\n  .settings-btn svg {\n    width: 16px;\n    height: 16px;\n    display: block;\n  }\n\n  .settings-btn:hover,\n  .settings-btn.active {\n    color: #1d4ed8;\n    border-color: #bfdbfe;\n    background: #eff6ff;\n    box-shadow: 0 1px 2px rgba(37, 99, 235, 0.08);\n  }\n\n  .settings-menu {\n    position: absolute;\n    top: 38px;\n    right: 0;\n    width: 240px;\n    padding: 8px;\n    background: #fff;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);\n    z-index: 50;\n  }\n\n  .settings-menu[hidden] {\n    display: none;\n  }\n\n  .settings-title {\n    padding: 2px 8px 7px;\n    color: #6b7280;\n    font-size: 11px;\n    font-weight: 700;\n  }\n\n  .setting-row {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    padding: 8px;\n    border-radius: 8px;\n    font-size: 12px;\n    color: #172033;\n    cursor: pointer;\n  }\n\n  .setting-row:hover {\n    background: #f3f4f6;\n  }\n\n  .setting-row .col-name {\n    flex: 1;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .freeze-toggle {\n    border: 0;\n    background: transparent;\n    padding: 3px;\n    cursor: pointer;\n    color: #9ca3af;\n    border-radius: 6px;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    opacity: 0.55;\n    transition: opacity .15s ease, background .15s ease, color .15s ease;\n  }\n\n  .freeze-toggle svg {\n    width: 14px;\n    height: 14px;\n    display: block;\n  }\n\n  .freeze-toggle:hover {\n    opacity: 1;\n    color: #4b5563;\n    background: #eef0f3;\n  }\n\n  .freeze-toggle.active {\n    color: #2563eb;\n    background: #dbeafe;\n    opacity: 1;\n  }\n\n  .freeze-toggle.active:hover {\n    background: #bfdbfe;\n  }\n\n  .freeze-toggle.active .lock-body {\n    fill: currentColor;\n  }\n\n  .settings-section {\n    border-top: 1px solid #eef0f3;\n    margin-top: 7px;\n    padding-top: 7px;\n  }\n\n  .settings-actions {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 6px;\n  }\n\n  .settings-actions button,\n  .path-chip {\n    padding: 6px 7px;\n    font-size: 12px;\n  }\n\n  .column-list,\n  .path-list {\n    max-height: 150px;\n    overflow: auto;\n  }\n\n  .path-chip {\n    width: 100%;\n    margin-top: 4px;\n    overflow: hidden;\n    text-align: left;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .search-hit {\n    background: #fef08a;\n    border-radius: 3px;\n    padding: 0 1px;\n  }\n\n  .filter-chips {\n    display: none;\n    gap: 6px;\n    padding: 7px 12px;\n    background: #fff;\n    border-bottom: 1px solid #eef0f3;\n    flex-wrap: wrap;\n  }\n\n  .filter-chips.active {\n    display: flex;\n  }\n\n  .filter-chip {\n    display: inline-flex;\n    align-items: center;\n    gap: 5px;\n    max-width: 260px;\n    padding: 4px 7px;\n    border: 1px solid #bfdbfe;\n    border-radius: 999px;\n    color: #1d4ed8;\n    background: #eff6ff;\n    font-size: 12px;\n  }\n\n  .filter-chip-text {\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .filter-chip-remove {\n    width: 18px;\n    height: 18px;\n    padding: 0;\n    border: 0;\n    border-radius: 999px;\n    color: #1d4ed8;\n    background: transparent;\n    line-height: 1;\n  }\n\n  .filter-chip-remove:hover {\n    background: #dbeafe;\n  }\n\n  .value-th-wrap {\n    position: relative;\n    display: inline-flex;\n    align-items: center;\n    justify-content: flex-start;\n    gap: 6px;\n  }\n\n  .tree-menu-btn {\n    width: 26px;\n    height: 22px;\n    padding: 0;\n    border-radius: 5px;\n    border-color: #bfdbfe;\n    color: #1d4ed8;\n    background: #eff6ff;\n    font-size: 13px;\n    line-height: 1;\n  }\n\n  .tree-menu-btn:hover {\n    background: #dbeafe;\n  }\n\n  .tree-menu {\n    position: fixed;\n    width: 150px;\n    display: flex;\n    flex-direction: column;\n    padding: 6px;\n    background: #fff;\n    border: 1px solid #d1d5db;\n    border-radius: 10px;\n    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);\n    z-index: 9999;\n  }\n\n  .tree-action {\n    border: 0;\n    border-radius: 6px;\n    padding: 7px 8px;\n    text-align: left;\n    font-size: 12px;\n    background: #fff;\n  }\n\n  .tree-action:hover {\n    background: #f3f4f6;\n  }\n\n  .content {\n    flex: 1;\n    overflow: auto;\n    padding: 12px;\n  }\n\n  table.grid {\n    width: 100%;\n    border-collapse: collapse;\n    background: #fff;\n    border: 1px solid #e5e7eb;\n  }\n\n  table.grid th,\n  table.grid td {\n    border-bottom: 1px solid #eef0f3;\n    border-right: 1px solid #eef0f3;\n    padding: 8px 10px;\n    vertical-align: top;\n    word-break: break-word;\n  }\n\n  table.grid th {\n    padding-right: 18px;\n  }\n\n  table.grid th:last-child,\n  table.grid td:last-child {\n    border-right: 0;\n  }\n\n  table.grid th {\n    background: #f3f4f6;\n    text-align: left;\n    font-size: 12px;\n    color: #4b5563;\n    min-width: 80px;\n  }\n\n  .content.freeze-header table.root-grid > thead th {\n    position: sticky;\n    top: 0;\n    z-index: 3;\n  }\n\n  table.grid .key-col,\n  table.grid .type-col,\n  table.grid .index-col {\n    width: 1%;\n    white-space: nowrap;\n  }\n\n  table.grid .key-col {\n    min-width: 90px;\n  }\n\n  table.grid .type-col {\n    min-width: 72px;\n  }\n\n  table.grid .value-col {\n    width: auto;\n  }\n\n  table.root-grid th.frozen-col,\n  table.root-grid td.frozen-col {\n    position: sticky;\n    left: 0;\n  }\n\n  /* Frozen cell backgrounds live in CSS (not inline) so dynamic row/zebra/\n     selected backgrounds (if added later) aren't clobbered by inline styles\n     (L6). */\n  table.root-grid thead th.frozen-col {\n    background: #f3f4f6;\n  }\n\n  table.root-grid tbody td.frozen-col {\n    background: #fff;\n  }\n\n  table.grid.nested-grid th {\n    position: static;\n    top: auto;\n    z-index: auto;\n    background: #f3f4f6;\n  }\n\n  table.grid.nested-grid td:first-child {\n    position: static;\n    left: auto;\n    z-index: auto;\n  }\n\n  table.grid.nested-grid th:first-child {\n    position: static;\n    left: auto;\n    z-index: auto;\n  }\n\n  .col-resizer {\n    position: absolute;\n    top: 0;\n    right: -3px;\n    width: 7px;\n    height: 100%;\n    cursor: col-resize;\n    z-index: 4;\n  }\n\n  .col-resizer:hover {\n    background: rgba(37, 99, 235, 0.16);\n  }\n\n  body.resizing-col {\n    cursor: col-resize;\n    user-select: none;\n  }\n    .th-wrap {\n    position: relative;\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    justify-content: flex-start;\n  }\n\n  .th-left {\n    min-width: 0;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n  }\n\n  .th-title {\n    border: 0;\n    background: transparent;\n    padding: 0;\n    color: inherit;\n    font: inherit;\n    font-weight: 700;\n    overflow: hidden;\n    text-overflow: ellipsis;\n  }\n\n  .th-title:hover {\n    background: transparent;\n    color: #2563eb;\n    text-decoration: underline;\n  }\n\n  .sort-mark {\n    color: #2563eb;\n    font-size: 11px;\n  }\n\n  .filter-btn {\n    width: 22px;\n    height: 22px;\n    padding: 0;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: 5px;\n    font-size: 12px;\n    line-height: 1;\n  }\n\n  .filter-btn svg {\n    width: 13px;\n    height: 13px;\n    display: block;\n  }\n\n  .filter-btn.active {\n    color: #fff;\n    background: #2563eb;\n    border-color: #2563eb;\n  }\n\n  .filter-menu {\n    position: fixed;\n    top: -9999px;\n    left: -9999px;\n    right: auto;\n    width: 260px;\n    max-height: 360px;\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n    padding: 10px;\n    background: #fff;\n    border: 1px solid #d1d5db;\n    border-radius: 10px;\n    box-shadow: 0 18px 42px rgba(15, 23, 42, 0.20);\n    z-index: 10050;\n    color: #172033;\n    visibility: hidden;\n  }\n\n  .filter-menu input[type=\"text\"],\n  .filter-menu select {\n    width: 100%;\n    box-sizing: border-box;\n    border: 1px solid #d1d5db;\n    border-radius: 6px;\n    padding: 6px 8px;\n    font-size: 12px;\n    background: #fff;\n  }\n\n  .filter-condition {\n    display: grid;\n    grid-template-columns: 108px 1fr;\n    gap: 6px;\n  }\n\n  .filter-actions {\n    display: flex;\n    gap: 6px;\n  }\n\n  .filter-actions button {\n    flex: 1;\n    padding: 5px 6px;\n    font-size: 12px;\n  }\n\n  .value-list {\n    max-height: 180px;\n    overflow: auto;\n    border: 1px solid #eef0f3;\n    border-radius: 8px;\n  }\n\n  .check-row {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    padding: 6px 8px;\n    border-bottom: 1px solid #f1f3f5;\n    font-weight: 400;\n    color: #172033;\n  }\n\n  .check-row:last-child {\n    border-bottom: 0;\n  }\n\n  .check-label {\n    flex: 1;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .check-count {\n    color: #6b7280;\n    font-size: 11px;\n  }\n\n  .type {\n    color: #6b7280;\n    font-size: 12px;\n  }\n\n  .number-value,\n  .type-number {\n    font-weight: 700;\n  }\n\n  .key-jump {\n    border: 0;\n    background: transparent;\n    padding: 0;\n    color: #2563eb;\n    font: inherit;\n    font-weight: 600;\n    cursor: pointer;\n  }\n\n  .key-jump:hover {\n    text-decoration: underline;\n    background: transparent;\n  }\n\n  .json-string-badge,\n  .json-parse-warn-badge {\n    display: inline-flex;\n    align-items: center;\n    margin-right: 5px;\n    padding: 1px 5px;\n    border-radius: 999px;\n    font-size: 11px;\n    font-weight: 700;\n  }\n\n  .json-string-badge {\n    color: #166534;\n    background: #dcfce7;\n  }\n\n  .json-parse-warn-badge {\n    color: #92400e;\n    background: #fef3c7;\n  }\n\n  .summary-main {\n    display: inline-flex;\n    align-items: center;\n    gap: 4px;\n  }\n\n  .node-actions {\n    display: inline-flex;\n    gap: 4px;\n    margin-left: 8px;\n    vertical-align: middle;\n  }\n\n  .node-action {\n    padding: 1px 5px;\n    border-radius: 5px;\n    font-size: 11px;\n    color: #4b5563;\n    background: #fff;\n  }\n\n  .node-action:hover {\n    color: #1d4ed8;\n    border-color: #bfdbfe;\n    background: #eff6ff;\n  }\n\n  .node-action[disabled] {\n    display: none;\n  }\n\n  details {\n    margin: 0;\n  }\n\n  summary {\n    cursor: pointer;\n    color: #2563eb;\n    list-style: none;\n  }\n\n  summary::-webkit-details-marker {\n    display: none;\n  }\n\n  .muted {\n    color: #6b7280;\n  }\n\n  pre {\n    margin: 0;\n    padding: 12px;\n    background: #fff;\n    border: 1px solid #e5e7eb;\n    white-space: pre-wrap;\n    word-break: break-word;\n  }\n\n  .empty {\n    margin-top: 12px;\n    padding: 24px;\n    color: #6b7280;\n    background: #fff;\n    border: 1px dashed #d1d5db;\n    border-radius: 10px;\n  }\n\n  .perf-note {\n    margin: 8px 0;\n    padding: 8px 10px;\n    color: #92400e;\n    background: #fffbeb;\n    border: 1px solid #fde68a;\n    border-radius: 8px;\n    font-size: 12px;\n  }\n  \n  .path-select {\n    max-width: 260px;\n    border: 1px solid #d1d5db;\n    border-radius: 8px;\n    padding: 7px 10px;\n    background: #fff;\n  }\n\n  .sticky-context {\n    display: none;\n    align-items: center;\n    gap: 8px;\n    min-height: 32px;\n    padding: 6px 12px;\n    color: #1f2937;\n    background: rgba(255, 255, 255, .96);\n    border-bottom: 1px solid #dbeafe;\n    box-shadow: 0 6px 18px rgba(15, 23, 42, .08);\n    z-index: 8;\n    font-size: 12px;\n  }\n\n  .sticky-context.active {\n    display: flex;\n  }\n\n  .sticky-context-label {\n    color: #6b7280;\n    font-weight: 600;\n  }\n\n  .sticky-context-path {\n    overflow: hidden;\n    color: #2563eb;\n    font-weight: 700;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .sticky-context-summary {\n    color: #6b7280;\n    white-space: nowrap;\n  }\n\n  .sticky-context 000;\n  }\n<\/style>\n\n<div class=\"app\">\n  <div class=\"bar\">\n    <div class=\"title\">JSON Table<\/div>\n    <div class=\"meta\" id=\"meta\"><\/div>\n    <button id=\"pathUp\" title=\"上一级路径\">上级<\/button>\n    <select id=\"pathSelect\" class=\"path-select\"><\/select>\n    <input id=\"globalSearch\" class=\"search\" placeholder=\"全局搜索\">\n    <button id=\"resetFilters\">重置过滤<\/button>\n    <button id=\"toggle\">原始<\/button>\n    <div class=\"settings-wrap\" id=\"settingsWrap\">\n      <button id=\"settingsBtn\" class=\"settings-btn\" title=\"设置\" aria-label=\"设置\" aria-expanded=\"false\">\n        <svg viewBox=\"0 0 16 16\" aria-hidden=\"true\">\n          <path d=\"M3 4.5h10M3 11.5h10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>\n          <circle cx=\"6\" cy=\"4.5\" r=\"1.7\" fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n          <circle cx=\"10\" cy=\"11.5\" r=\"1.7\" fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n        <\/svg>\n      <\/button>\n      <div id=\"settingsMenu\" class=\"settings-menu\" hidden>\n        <div class=\"settings-title\">设置<\/div>\n        <label class=\"setting-row\">\n          <input id=\"showTypeCheck\" type=\"checkbox\">\n          <span>显示 Type 列<\/span>\n        <\/label>\n        <label class=\"setting-row\" title=\"滚动时保持表头行固定在顶部（仅固定行；冻结列请用各列设置里的锁图标）\">\n          <input id=\"freezeHeaderCheck\" type=\"checkbox\">\n          <span>固定表头行<\/span>\n        <\/label>\n        <label class=\"setting-row\">\n          <input id=\"showStickyHeaderCheck\" type=\"checkbox\">\n          <span>显示层级浮动表头<\/span>\n        <\/label>\n        <label class=\"setting-row\">\n          <input id=\"parseJsonStringCheck\" type=\"checkbox\">\n          <span>解析 JSON 字符串<\/span>\n        <\/label>\n        <label class=\"setting-row\">\n          <span>浮动表头模式<\/span>\n          <select id=\"headerModeSelect\" style=\"margin-left:auto;max-width:96px\">\n            <option value=\"single\">单层<\/option>\n            <option value=\"multi\">多层<\/option>\n          <\/select>\n        <\/label>\n        <div class=\"settings-section\">\n          <div class=\"settings-title\">字段显示<\/div>\n          <div id=\"columnSettings\" class=\"column-list\"><\/div>\n        <\/div>\n        <div class=\"settings-section\">\n          <div class=\"settings-title\">复制 / 导出<\/div>\n          <div class=\"settings-actions\">\n            <button id=\"copyPathBtn\">复制路径<\/button>\n            <button id=\"copyJsonBtn\">复制 JSON<\/button>\n            <button id=\"exportJsonBtn\">导出 JSON<\/button>\n            <button id=\"exportCsvBtn\">导出 CSV<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"settings-section\">\n          <div class=\"settings-title\">路径<\/div>\n          <button id=\"favPathBtn\" class=\"path-chip\">收藏当前路径<\/button>\n          <div id=\"pathShortcuts\" class=\"path-list\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"filter-chips\" id=\"filterChips\"><\/div>\n  <div class=\"sticky-context\" id=\"stickyContextBar\" title=\"当前滚动层级\">\n    <span class=\"sticky-context-label\">当前层级<\/span>\n    <span class=\"sticky-context-path\" id=\"stickyContextPath\"><\/span>\n    <span class=\"sticky-context-summary\" id=\"stickyContextSummary\"><\/span>\n    <button id=\"stickyContextJump\" type=\"button\">定位<\/button>\n  <\/div>\n  <div class=\"sticky-table-head\" id=\"stickyTableHead\">\n    <div class=\"sticky-table-head-inner\" id=\"stickyTableHeadInner\"><\/div>\n  <\/div>\n  <div class=\"content\" id=\"content\"><\/div>\n<\/div>\n\n<script>\n  pm.getData(function (err, data) {\n    var raw = data.raw || \"\";\n    var content = document.getElementById(\"content\");\n    var stickyContextBar = document.getElementById(\"stickyContextBar\");\n    var stickyContextPath = document.getElementById(\"stickyContextPath\");\n    var stickyContextSummary = document.getElementById(\"stickyContextSummary\");\n    var stickyContextJump = document.getElementById(\"stickyContextJump\");\n    var filterChips = document.getElementById(\"filterChips\");\n    var stickyTableHead = document.getElementById(\"stickyTableHead\");\n    var stickyTableHeadInner = document.getElementById(\"stickyTableHeadInner\");\n    var meta = document.getElementById(\"meta\");\n    var toggle = document.getElementById(\"toggle\");\n    var settingsWrap = document.getElementById(\"settingsWrap\");\n    var settingsBtn = document.getElementById(\"settingsBtn\");\n    var settingsMenu = document.getElementById(\"settingsMenu\");\n    var showTypeCheck = document.getElementById(\"showTypeCheck\");\n    var freezeHeaderCheck = document.getElementById(\"freezeHeaderCheck\");\n    var showStickyHeaderCheck = document.getElementById(\"showStickyHeaderCheck\");\n    var parseJsonStringCheck = document.getElementById(\"parseJsonStringCheck\");\n    var headerModeSelect = document.getElementById(\"headerModeSelect\");\n    var columnSettings = document.getElementById(\"columnSettings\");\n    var copyPathBtn = document.getElementById(\"copyPathBtn\");\n    var copyJsonBtn = document.getElementById(\"copyJsonBtn\");\n    var exportJsonBtn = document.getElementById(\"exportJsonBtn\");\n    var exportCsvBtn = document.getElementById(\"exportCsvBtn\");\n    var favPathBtn = document.getElementById(\"favPathBtn\");\n    var pathShortcuts = document.getElementById(\"pathShortcuts\");\n    var globalSearch = document.getElementById(\"globalSearch\");\n    var resetFilters = document.getElementById(\"resetFilters\");\n    var pathSelect = document.getElementById(\"pathSelect\");\n    var pathUp = document.getElementById(\"pathUp\");\n\n    var showTable = true;\n    var showTypeColumn = false;\n    var json;\n    var tableRows = null;\n    var tablePath = \"$\";\n    var selectedPath = \"$\";\n    var nodesByPath = {};\n    var columnFilters = {};\n    var activeFilterColumn = null;\n    var sortState = { col: null, dir: null };\n    var columnWidths = {};\n    var hiddenColumnsByPath = {};\n    var frozenColumnsByPath = {};\n    var pendingFreezeFirstCol = false;\n    var renderedNodesByPath = {};\n    var parseFailureSamples = {};\n    var currentAllColumns = [];\n    var currentColumns = [];\n    var currentRows = [];\n    var recentPaths = [\"$\"];\n    var favoritePaths = {};\n    var MAX_RENDER_ROWS = 2000;\n    var treeMenuOpen = false;\n    var activeTreeTable = null;\n    var activeTreeColumnIndex = -1;\n    var expandedDetailPaths = {};\n    var suppressDetailToggle = false;\n    var stickyContextPathValue = \"\";\n    var stickyContextTicking = false;\n    var stickyTableHeadKey = \"\";\n    var stickyHeaderMode = \"single\";\n    var showStickyHeader = true;\n    var parseJsonString = true;\n    var freezeHeader = false;\n    var STORAGE_KEY = \"apifox-json-table-state-v2\";\n    var LARGE_JSON_CHARS = 500000;\n    var LARGE_SEARCH_CHARS = 250000;\n\n    try {\n      json = JSON.parse(raw);\n    } catch (e) {\n      meta.textContent = \"非 JSON 响应\";\n      content.innerHTML = \"<pre><\/pre>\";\n      content.querySelector(\"pre\").textContent = raw;\n      return;\n    }\n\n    function esc(v) {\n      return String(v)\n        .replace(/&/g, \"&amp;\")\n        .replace(/<\/g, \"&lt;\")\n        .replace(/>/g, \"&gt;\")\n        .replace(/\"/g, \"&quot;\");\n    }\n\n    function safeStorageGet(key) {\n      try { return localStorage.getItem(key); } catch (e) { return null; }\n    }\n\n    function safeStorageSet(key, value) {\n      try { localStorage.setItem(key, value); } catch (e) {}\n    }\n\n    function isPlainObject(v) {\n      return v && typeof v === \"object\" && !Array.isArray(v);\n    }\n\n    function loadPersistedState() {\n      var saved = safeStorageGet(STORAGE_KEY);\n      if (!saved) return;\n\n      try {\n        var state = JSON.parse(saved);\n        if (!isPlainObject(state)) return;\n\n        showTypeColumn = !!state.showTypeColumn;\n        freezeHeader = !!state.freezeHeader;\n        showStickyHeader = state.showStickyHeader !== false;\n        parseJsonString = state.parseJsonString !== false;\n        stickyHeaderMode = state.stickyHeaderMode === \"multi\" ? \"multi\" : \"single\";\n        columnWidths = isPlainObject(state.columnWidths) ? state.columnWidths : {};\n        hiddenColumnsByPath = isPlainObject(state.hiddenColumnsByPath) ? state.hiddenColumnsByPath : {};\n        var hadFrozenColumns = Object.prototype.hasOwnProperty.call(state, \"frozenColumnsByPath\");\n        frozenColumnsByPath = isPlainObject(state.frozenColumnsByPath) ? state.frozenColumnsByPath : {};\n        favoritePaths = isPlainObject(state.favoritePaths) ? state.favoritePaths : {};\n        recentPaths = Array.isArray(state.recentPaths) && state.recentPaths.length ? state.recentPaths.slice(0, 6) : recentPaths;\n        if (state.freezeHeader && !hadFrozenColumns) pendingFreezeFirstCol = true;\n      } catch (e) {}\n    }\n\n    function savePersistedState() {\n      safeStorageSet(STORAGE_KEY, JSON.stringify({\n        showTypeColumn: showTypeColumn,\n        freezeHeader: freezeHeader,\n        showStickyHeader: showStickyHeader,\n        parseJsonString: parseJsonString,\n        stickyHeaderMode: stickyHeaderMode,\n        columnWidths: columnWidths,\n        hiddenColumnsByPath: hiddenColumnsByPath,\n        frozenColumnsByPath: frozenColumnsByPath,\n        favoritePaths: favoritePaths,\n        recentPaths: recentPaths\n      }));\n    }\n        function isObj(v) {\n      return v && typeof v === \"object\" && !Array.isArray(v);\n    }\n\n    function highlightText(text) {\n      var rawText = String(text);\n      var q = globalSearch.value.trim();\n      if (!q) return esc(rawText);\n\n      var lower = rawText.toLowerCase();\n      var needle = q.toLowerCase();\n      var html = \"\";\n      var from = 0;\n      var index = lower.indexOf(needle);\n\n      while (index >= 0) {\n        html += esc(rawText.slice(from, index));\n        html += '<span class=\"search-hit\">' + esc(rawText.slice(index, index + q.length)) + '<\/span>';\n        from = index + q.length;\n        index = lower.indexOf(needle, from);\n      }\n\n      return html + esc(rawText.slice(from));\n    }\n\n    function typeOf(v) {\n      if (Array.isArray(v)) return \"array\";\n      if (v === null) return \"null\";\n      return typeof v;\n    }\n\n    function valueText(v) {\n      if (v === undefined) return \"\";\n      if (v === null) return \"null\";\n      if (typeof v === \"string\") return v;\n      if (typeof v === \"number\" || typeof v === \"boolean\") return String(v);\n      return JSON.stringify(v);\n    }\n\n    function summarize(v) {\n      if (v === undefined) return \"\";\n      if (v === null) return \"null\";\n      if (Array.isArray(v)) return \"[\" + v.length + \" items]\";\n      if (isObj(v)) return \"{\" + Object.keys(v).length + \" keys}\";\n      return String(v);\n    }\n\n    function tryParseJsonStringValue(v) {\n      if (!parseJsonString || typeof v !== \"string\") return null;\n\n      var text = v.trim();\n      if (!text || (text[0] !== \"{\" && text[0] !== \"[\")) return null;\n\n      try {\n        var parsed = JSON.parse(text);\n        return parsed && typeof parsed === \"object\" ? parsed : null;\n      } catch (e) {\n        parseFailureSamples[text.slice(0, 120)] = true;\n        return null;\n      }\n    }\n\n    function isRecordArray(v) {\n      return Array.isArray(v) && v.length > 0 && v.every(function (item) {\n        return isObj(item);\n      });\n    }\n\n    function collectColumns(rows) {\n      var cols = [];\n      rows.forEach(function (row) {\n        if (!isObj(row)) return;\n        Object.keys(row).forEach(function (k) {\n          if (cols.indexOf(k) < 0) cols.push(k);\n        });\n      });\n      return cols;\n    }\n\n    function getHiddenColumns(path) {\n      hiddenColumnsByPath[path] = hiddenColumnsByPath[path] || {};\n      return hiddenColumnsByPath[path];\n    }\n\n    function getVisibleColumns(cols, path) {\n      var hidden = getHiddenColumns(path);\n      var visible = cols.filter(function (col) {\n        return !hidden[col];\n      });\n      return visible.length ? visible : cols;\n    }\n\n    function setColumnVisible(path, col, visible) {\n      var hidden = getHiddenColumns(path);\n      if (visible) {\n        delete hidden[col];\n      } else {\n        hidden[col] = true;\n      }\n      savePersistedState();\n      render();\n    }\n\n    function getFrozenColumns(path) {\n      // Read-only: never create an entry on read, otherwise every visited\n      // table path (especially nested ones) pollutes frozenColumnsByPath and\n      // gets persisted to localStorage indefinitely (L1).\n      return frozenColumnsByPath[path] || {};\n    }\n\n    function ensureFrozenColumns(path) {\n      if (!frozenColumnsByPath[path]) frozenColumnsByPath[path] = {};\n      return frozenColumnsByPath[path];\n    }\n\n    function isColumnFrozen(path, col) {\n      return !!getFrozenColumns(path)[col];\n    }\n\n    function setColumnFrozen(path, col, frozen) {\n      var frozenSet = ensureFrozenColumns(path);\n      if (frozen) {\n        frozenSet[col] = true;\n      } else {\n        delete frozenSet[col];\n      }\n      savePersistedState();\n      render();\n    }\n\n    function findFirstRecordArray(v, path) {\n      if (isRecordArray(v)) {\n        return { rows: v, path: path || \"$\" };\n      }\n\n      if (Array.isArray(v)) {\n        for (var i = 0; i < v.length; i++) {\n          var foundInArray = findFirstRecordArray(v[i], (path || \"$\") + \"[\" + i + \"]\");\n          if (foundInArray) return foundInArray;\n        }\n      }\n\n      if (isObj(v)) {\n        var keys = Object.keys(v);\n        for (var j = 0; j < keys.length; j++) {\n          var key = keys[j];\n          var foundInObject = findFirstRecordArray(v[key], (path || \"$\") + \".\" + key);\n       const base = displayBaseKey(root);
      if (!base || !displayPath || displayPath === '$') return base ? '$.' + base : (displayPath || '$');
      return '$.' + base + displayPath.slice(1);
    }

    function displayPathFromSourcePath(sourcePath, root) {
      const base = displayBaseKey(root);
      const prefix = '$.' + base;
      if (!base || !sourcePath) return sourcePath || '$';
      if (sourcePath === prefix) return '$';
      if (sourcePath.startsWith(prefix + '.')) return '$' + sourcePath.slice(prefix.length);
      if (sourcePath.startsWith(prefix + '[')) return '$' + sourcePath.slice(prefix.length);
      return sourcePath;
    }

    function locateJsonPath(displayPath) {
      let root;
      try {
        root = JSON.parse(input.value);
      } catch (err) {
        setStatus('左侧 JSON 无效，无法定位', 'error');
        return;
      }

      const sourcePath = sourcePathFromDisplayPath(displayPath, root);
      const formatted = JSON.stringify(root, null, 2);
      if (input.value !== formatted) input.value = formatted;

      const location = resolveJsonLocation(root, formatted, sourcePath);
      if (!location || location.cursor < 0) {
        setStatus('未能定位：' + sourcePath, 'error');
        return;
      }

      setInputPaneCollapsed(false);
      input.focus();
      input.setSelectionRange(location.cursor, location.cursor + location.length);
      input.scrollTop = estimateScrollTop(input, location.cursor);
      input.classList.remove('locating');
      requestAnimationFrame(() => input.classList.add('locating'));
      setStatus('已定位 · ' + sourcePath, 'ok');
    }

    function resolveJsonLocation(root, formatted, sourcePath) {
      const segments = pathToSegments(sourcePath);
      const value = getValueBySegments(root, segments);
      if (value !== undefined) {
        const target = primitiveJsonText(value);
        return { cursor: findJsonCursor(formatted, segments, target), length: target.length };
      }

      return resolveParsedStringLocation(root, formatted, segments);
    }

    function resolveParsedStringLocation(root, formatted, segments) {
      for (let split = segments.length - 1; split > 0; split -= 1) {
        const prefixSegments = segments.slice(0, split);
        const rawString = getValueBySegments(root, prefixSegments);
        if (typeof rawString !== 'string') continue;

        let parsed;
        try {
          parsed = JSON.parse(rawString);
        } catch (err) {
          continue;
        }

        const innerSegments = segments.slice(split);
        const innerValue = getValueBySegments(parsed, innerSegments);
        if (innerValue === undefined) continue;

        const outerStart = findJsonCursor(formatted, prefixSegments, primitiveJsonText(rawString));
        const innerTarget = primitiveJsonText(innerValue);
        const innerStart = findJsonCursor(rawString, innerSegments, innerTarget);
        if (outerStart < 0 || innerStart < 0) continue;

        const cursor = mapStringIndexToJsonLiteral(rawString, outerStart, innerStart);
        const length = escapedSliceLength(rawString, innerStart, innerTarget.length);
        return { cursor, length: Math.max(1, length) };
      }

      return null;
    }

    // 在父窗口作用域内提供 parsed 字符串解析能力（visualizerScript 内的同名函数
    // 仅在 new Function 作用域中可用，父窗口拿不到，会导致点击左侧 JSON 时抛 ReferenceError）。
    function tryParseJsonStringValue(value) {
      if (typeof value !== 'string') return null;
      const text = value.trim();
      if (!text || (text[0] !== '{' && text[0] !== '[')) return null;
      try {
        const parsed = JSON.parse(text);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch (err) {
        return null;
      }
    }

    // 给定一段 JSON 文本与目标字符下标，返回“最内层包含该下标的节点”的路径后缀。
    function deepestJsonPathSuffix(text, target) {
      let pos = 0;
      const skipWs = () => { while (pos < text.length && /\s/.test(text[pos])) pos += 1; };
      const readString = () => {
        let s = '';
        pos += 1;
        while (pos < text.length) {
          const c = text[pos];
          if (c === '\\') { pos += 2; }
          else if (c === '"') { pos += 1; break; }
          else { s += c; pos += 1; }
        }
        return s;
      };
      const parseNode = (path) => {
        skipWs();
        const start = pos;
        const ch = text[pos];
        if (ch === '{') {
          pos += 1;
          skipWs();
          if (text[pos] === '}') { pos += 1; return path; }
          let chosen = path;
          while (true) {
            skipWs();
            const key = readString();
            skipWs();
            pos += 1; // 跳过冒号
            skipWs();
            const cStart = pos;
            const childPath = path + '.' + key;
            const childResult = parseNode(childPath);
            const cEnd = pos;
            if (target >= cStart && target < cEnd) chosen = childResult;
            skipWs();
            if (text[pos] === ',') { pos += 1; skipWs(); continue; }
            if (text[pos] === '}' || pos >= text.length) { if (text[pos] === '}') pos += 1; break; }
            pos += 1;
          }
          return chosen;
        }
        if (ch === '[') {
          pos += 1;
          skipWs();
          if (text[pos] === ']') { pos += 1; return path; }
          let chosen = path;
          let idx = 0;
          while (true) {
            skipWs();
            const cStart = pos;
            const childPath = path + '[' + idx + ']';
            const childResult = parseNode(childPath);
            const cEnd = pos;
            if (target >= cStart && target < cEnd) chosen = childResult;
            skipWs();
            if (text[pos] === ',') { pos += 1; skipWs(); idx += 1; continue; }
            if (text[pos] === ']' || pos >= text.length) { if (text[pos] === ']') pos += 1; break; }
            pos += 1;
          }
          return chosen;
        }
        // 基础值（字符串/数字/布尔/null）：自身即节点路径
        if (ch === '"') readString();
        else { while (pos < text.length && !/[\s,}\]]/.test(text[pos])) pos += 1; }
        return path;
      };
      return parseNode('');
    }

    // 光标落在某个“可解析字符串值”内部时，计算其在解析后 JSON 里的内部子路径，
    // 返回形如 $.data.list[0].settings_json.routing.timeoutMs 的完整源路径。
    function resolveParsedStringCursorPath(root, formatted, item, cursor) {
      const segments = pathToSegments(item.path);
      const rawString = getValueBySegments(root, segments);
      if (typeof rawString !== 'string') return null;
      let parsed;
      try {
        parsed = JSON.parse(rawString);
      } catch (err) {
        return null;
      }
      if (!parsed || typeof parsed !== 'object') return null;

      const literalStart = item.valueStart;
      if (cursor < literalStart + 1) return null;
      // 把外层面板里（位于转义字符串字面量内部）的光标位置，映射回原始未转义字符串的下标
      let rawIndex = 0;
      let i = literalStart + 1;
      const literalEnd = item.valueEnd;
      while (i < cursor && i < literalEnd) {
        if (formatted[i] === '\\') i += 2;
        else i += 1;
        rawIndex += 1;
      }

      const innerSuffix = deepestJsonPathSuffix(rawString, rawIndex);
      return item.path + innerSuffix;
    }

    function mapStringIndexToJsonLiteral(rawString, literalStart, innerIndex) {
      const escapedPrefix = JSON.stringify(rawString.slice(0, innerIndex)).slice(1, -1);
      return literalStart + 1 + escapedPrefix.length;
    }

    function escapedSliceLength(rawString, innerStart, rawLength) {
      return JSON.stringify(rawString.slice(innerStart, innerStart + rawLength)).slice(1, -1).length;
    }

    function collectJsonPaths(value, path, output, depth = 0) {
      if (output.length > 5000 || depth > 80) return output;
      output.push(path);
      if (Array.isArray(value)) {
        value.forEach((item, index) => collectJsonPaths(item, path + '[' + index + ']', output, depth + 1));
        return output;
      }
      if (value && typeof value === 'object') {
        Object.keys(value).forEach((key) => collectJsonPaths(value[key], path + '.' + key, output, depth + 1));
      }
      return output;
    }

    function pathFromInputCursor() {
      let root;
      try {
        root = JSON.parse(input.value);
      } catch (err) {
        return '';
      }

      const formatted = JSON.stringify(root, null, 2);
      if (input.value !== formatted) return '';

      const cursor = input.selectionEnd > input.selectionStart
        ? Math.floor((input.selectionStart + input.selectionEnd) / 2)
        : (input.selectionStart || 0);
      const index = buildTextPathIndex(root, formatted);
      const lineHit = findLinePathHit(index, cursor, root, formatted);
      if (lineHit) return displayPathFromSourcePath(lineHit, root);

      const rangeHit = findRangePathHit(index, cursor, root, formatted);
      return displayPathFromSourcePath(rangeHit || '$', root);
    }

    function buildTextPathIndex(root, formatted) {
      return collectJsonPaths(root, '$', []).map((path) => {
        const segments = pathToSegments(path);
        const value = getValueBySegments(root, segments);
        const valueStart = findJsonCursor(formatted, segments, primitiveJsonText(value));
        const keyStart = findJsonKeyCursor(formatted, root, segments);
        const anchor = keyStart >= 0 ? keyStart : valueStart;
        const lineStart = anchor >= 0 ? formatted.lastIndexOf('\n', Math.max(0, anchor - 1)) + 1 : -1;
        const nextLine = anchor >= 0 ? formatted.indexOf('\n', anchor) : -1;
        const lineEnd = nextLine >= 0 ? nextLine : formatted.length;
        const parsedStringJson = typeof value === 'string' ? tryParseJsonStringValue(value) : null;
        return {
          path,
          depth: segments.length,
          keyStart,
          valueStart,
          valueEnd: valueStart >= 0 ? findJsonValueEnd(formatted, valueStart) : -1,
          lineStart,
          lineEnd,
          parsedStringJson: parsedStringJson
        };
      }).filter((item) => item.valueStart >= 0 || item.keyStart >= 0);
    }

    function findLinePathHit(index, cursor, root, formatted) {
      let best = null;
      let parsedHit = null;
      for (let k = 0; k < index.length; k += 1) {
        const item = index[k];
        if (item.keyStart < 0) continue;
        if (cursor < item.lineStart || cursor > item.lineEnd) continue;
        // 命中可解析字符串值时，优先落到 parsed 内部子路径
        if (item.parsedStringJson && cursor >= item.valueStart && cursor <= item.valueEnd) {
          const hit = resolveParsedStringCursorPath(root, formatted, item, cursor);
          if (hit) parsedHit = hit;
        }
        if (!best || item.depth > best.depth || (item.depth === best.depth && item.keyStart > best.keyStart)) {
          best = item;
        }
      }
      if (parsedHit) return parsedHit;
      return best && best.path;
    }

    function findRangePathHit(index, cursor, root, formatted) {
      let best = null;
      let parsedHit = null;
      for (let k = 0; k < index.length; k += 1) {
        const item = index[k];
        if (item.valueStart < 0 || item.valueEnd < item.valueStart) continue;
        if (cursor < item.valueStart || cursor > item.valueEnd) continue;
        // 命中可解析字符串值时，优先落到 parsed 内部子路径
        if (item.parsedStringJson) {
          const hit = resolveParsedStringCursorPath(root, formatted, item, cursor);
          if (hit) parsedHit = hit;
        }
        if (!best || item.depth > best.depth || (item.depth === best.depth && item.valueStart > best.valueStart)) {
          best = item;
        }
      }
      if (parsedHit) return parsedHit;
      return best && best.path;
    }

    function findJsonValueEnd(text, start) {
      if (start < 0) return -1;
      let depth = 0;
      let inString = false;
      let escaped = false;
      for (let i = start; i < text.length; i += 1) {
        const ch = text[i];
        if (inString) {
          if (escaped) { escaped = false; continue; }
          if (ch === '\\') { escaped = true; continue; }
          if (ch === '"') inString = false;
          continue;
        }
        if (ch === '"') inString = true;
        else if (ch === '{' || ch === '[') depth += 1;
        else if (ch === '}' || ch === ']') {
          if (depth === 0) return i;
          depth -= 1;
        } else if ((ch === ',' || ch === '\n') && depth === 0) {

        }
      }
      return text.length;
    }

    function getValueBySegments(root, segments) {
      let value = root;
      for (const segment of segments) {
        if (value == null) return undefined;
        value = value[segment];
      }
      return value;
    }

    function findJsonKeyCursor(text, root, segments) {
      const key = segments[segments.length - 1];
      if (typeof key !== 'string') return -1;

      const parentSegments = segments.slice(0, -1);
      const parentValue = getValueBySegments(root, parentSegments);
      if (!parentValue || typeof parentValue !== 'object' || Array.isArray(parentValue)) return -1;

      const parentStart = findJsonCursor(text, parentSegments, primitiveJsonText(parentValue));
      if (parentStart < 0 || text[parentStart] !== '{') return -1;
      return findDirectObjectKeyStart(text, parentStart, JSON.stringify(key));
    }

    function findDirectObjectKeyStart(text, objectStart, keyText) {
      let pos = firstNonSpace(text, objectStart + 1);
      while (pos >= 0 && pos < text.length && text[pos] !== '}') {
        if (text[pos] !== '"') return -1;
        const keyEnd = findStringEnd(text, pos);
        if (keyEnd < 0) return -1;
        const colon = firstNonSpace(text, keyEnd + 1);
        if (text.slice(pos, keyEnd + 1) === keyText) return pos;
        if (text[colon] !== ':') return -1;
        const valueStart = firstNonSpace(text, colon + 1);
        const next = findNextSiblingStart(text, valueStart);
        if (next < 0) return -1;
        pos = next;
      }
      return -1;
    }

    function findStringEnd(text, start) {
      let escaped = false;
      for (let i = start + 1; i < text.length; i += 1) {
        const ch = text[i];
        if (escaped) {
          escaped = false;
          continue;
        }
        if (ch === '\\') {
          escaped = true;
          continue;
        }
        if (ch === '"') return i;
      }
      return -1;
    }

    function focusPreviewPath(path) {
      if (!path) return;
      pendingPreviewFocus = {
        path,
        bridgeId: previewBridgeId,
        focusId: ++previewFocusSeq,
        attempts: 0
      };
      flushPreviewFocus();
    }

    function flushPreviewFocus() {
      const focus = pendingPreviewFocus;
      if (!focus || focus.bridgeId !== previewBridgeId || !preview.contentWindow) return;
      preview.contentWindow.postMessage({
        type: 'json-table-focus-path',
        path: focus.path,
        focusId: focus.focusId,
        bridgeId: focus.bridgeId
      }, '*');
      if (focus.attempts >= 5) return;
      focus.attempts += 1;
      setTimeout(() => {
        if (pendingPreviewFocus && pendingPreviewFocus.focusId === focus.focusId) flushPreviewFocus();
      }, 180);
    }

    function findJsonCursor(text, segments, target) {
      let pos = 0;
      for (const segment of segments) {
        if (typeof segment === 'number') {
          pos = findArrayItemStart(text, pos, segment);
        } else {
          const keyText = JSON.stringify(segment);
          const keyPos = text.indexOf(keyText, pos);
          if (keyPos < 0) return -1;
          const colonPos = text.indexOf(':', keyPos + keyText.length);
          if (colonPos < 0) return -1;
          pos = firstNonSpace(text, colonPos + 1);
        }
        if (pos < 0) return -1;
      }

      if (!target) return pos;
      if (text.slice(pos, pos + target.length) === target) return pos;
      const nearby = text.indexOf(target, pos);
      return nearby >= 0 ? nearby : pos;

    function findArrayItemStart(text, valueStart, index) {
      const arrayStart = text.indexOf('[', valueStart);
      if (arrayStart < 0) return -1;
      let pos = firstNonSpace(text, arrayStart + 1);
      for (let i = 0; i < index; i += 1) {
        pos = findNextSiblingStart(text, pos);
        if (pos < 0) return -1;
      }
      return pos;
    }

    function findNextSiblingStart(text, start) {
      let depth = 0;
      let inString = false;
      let escaped = false;
      for (let i = start; i < text.length; i += 1) {
        const ch = text[i];
        if (inString) {
          if (escaped) {
            escaped = false;
            continue;
          }
          if (ch === '\\') {
            escaped = true;
            continue;
          }
          if (ch === '"') inString = false;
          continue;
        }
        if (ch === '"') inString = true;
        else if (ch === '{' || ch === '[') depth += 1;
        else if (ch === '}' || ch === ']') depth -= 1;
        else if (ch === ',' && depth === 0) return firstNonSpace(text, i + 1);
      }
      return -1;
    }

    function firstNonSpace(text, start) {
      let pos = start;
      while (/\s/.test(text[pos] || '')) pos += 1;
      return pos;
    }

    function estimateScrollTop(textarea, cursor) {
      const before = textarea.value.slice(0, cursor);
      const line = before.split('\n').length - 1;
      const lineHeight = 18.6;
      return Math.max(0, line * lineHeight - textarea.clientHeight * 0.35);
    }

    function capturePreviewStateFromDom() {
      try {
        const doc = preview.contentDocument;
        if (!doc) return previewState;
        const pathSelect = doc.getElementById('pathSelect');
        const globalSearch = doc.getElementById('globalSearch');
        const content = doc.getElementById('content');
        return {
          path: pathSelect ? pathSelect.value : '',
          search: globalSearch ? globalSearch.value : '',
          scrollTop: content ? content.scrollTop : 0,
          scrollLeft: content ? content.scrollLeft : 0,
          openPaths: Array.from(doc.querySelectorAll('details[data-path][open]')).map((item) => item.getAttribute('data-path'))
        };
      } catch (err) {
        return previewState;
      }
    }

    function restorePreviewState(state, bridgeId) {
      if (!state || !preview.contentWindow || bridgeId !== previewBridgeId) return;
      previewRestoringUntil = Date.now() + 900;
      preview.contentWindow.postMessage({ type: 'json-table-restore-state', state, bridgeId }, '*');
      setTimeout(() => {
        if (bridgeId === previewBridgeId) {
          previewState = capturePreviewStateFromDom() || state;
          previewRestoringUntil = 0;
        }
      }, 950);
    }

    function iframeBridgeScript(bridgeId) {
      return `<script>
        (function () {
          var BRIDGE_ID = ${bridgeId};
          var pendingStateTimer = null;
          var restoreInProgress = false;
          var focusRequestId = 0;
          var activeFocusToken = 0;
          var activeFocusTimer = null;

          function cellPath(cell) {
            var row = cell && cell.closest('tr[data-row-path]');
            if (!row) return '';
            var rowPath = row.getAttribute('data-row-path') || '';
            if (!rowPath) return '';
            var table = row.closest('table');
            var cellIndex = Array.prototype.indexOf.call(row.children, cell);
            var header = table && table.tHead && table.tHead.rows[0] && table.tHead.rows[0].cells[cellIndex];
            var col = header && header.getAttribute('data-col-key');
            if (!col || col === 'Key' || col === 'Type' || col === '#' || col === 'Value') return rowPath;
            return rowPath + '.' + col;
          }

          function cssEscape(value) {
            if (window.CSS && CSS.escape) return CSS.escape(value);
            return String(value).replace(/"/g, '\\"');
          }


          function installFocusStyle() {
            if (document.getElementById('jsonTableFocusStyle')) return;
            var style = document.createElement('style');
            style.id = 'jsonTableFocusStyle';
            style.textContent = [
              '.json-focus-row > td {',
              '  background: #eff6ff !important;',
              '}',
              '.json-focus-target {',
              '  background: #dbeafe !important;',
              '  outline: 3px solid #2563eb;',
              '  outline-offset: -3px;',
              '  position: relative;',
              '  z-index: 6;',
              '}',
              '.json-focus-row > td.json-focus-target {',
              '  background: #dbeafe !important;',
              '}'
            ].join('\\n');
            document.head.appendChild(style);
          }

          function findRowByPath(path) {
            var rows = document.querySelectorAll('tr[data-row-path]');
            for (var i = 0; i < rows.length; i += 1) {
              if (rows[i].getAttribute('data-row-path') === path) return rows[i];
            }
            return null;
          }

          function findTableByPath(path) {
            var tables = document.querySelectorAll('table[data-table-id]');
            for (var i = 0; i < tables.length; i += 1) {
              if (tables[i].getAttribute('data-table-id') === path) return tables[i];
            }
            return null;
          }

          function collectState() {
            var pathSelect = document.getElementById('pathSelect');
            var globalSearch = document.getElementById('globalSearch');
            var content = document.getElementById('content');
            return {
              path: pathSelect ? pathSelect.value : '',
              search: globalSearch ? globalSearch.value : '',
              scrollTop: content ? content.scrollTop : 0,
              scrollLeft: content ? content.scrollLeft : 0,
              openPaths: Array.prototype.map.call(document.querySelectorAll('details[data-path][open]'), function (item) {

            return Array.prototype.some.call(select.options || [], function (option) {

          function setRootPath(path) {
            var select = document.getElementById('pathSelect');

            select.dispatchEvent(new Event('change', { bubbles: true }));
            return true;
          }

          function bestRootPathFor(path) {
            var select = document.getElementById('pathSelect');
            if (!select) return '';
            var best = '';
            Array.prototype.forEach.call(select.options || [], function (option) {
              var value = option.value;
              var inside = path === value || path.indexOf(value + '.') === 0 || path.indexOf(value + '[') === 0;
              if (inside && value.length > best.length) best = value;

          function ensureRootForPath(path) {

            var best = bestRootPathFor(path);
            if (!select || !best || select.value === best) return false;

          function setSearch(search) {

            input.dispatchEvent(new Event('input', { bubbles: true }));
          }

          function restoreOpenPaths(paths) {
            (paths || []).forEach(function (path) {

          function restoreScroll(state) {

          }

          function restoreState(state) {
            if (!state) return;
            restoreInProgress = true;
            setRootPath(state.path);
            setTimeout(function () {

              setTimeout(function () {
                restoreOpenPaths(state.openPaths);

          function ancestorPaths(path) {

          function findTarget(path) {
            var cell = findCellByPath(path);

          }

          function findCellByPath(path) {
            var cells = document.querySelectorAll('tbody td');

            for (var i = 0; i < cells.length; i += 1) {

          }

          function isPreferredFocusCell(cell) {
            if (!cell || !cell.classList) return false;
            return cell.classList.contains('value-col') ||
              (!cell.classList.contains('key-col') && !cell.classList.contains('index-col') && !cell.classList.contains('type-col'));
          }

          function preferredCellForRow(row) {
            if (!row || !row.cells || !row.cells.length) return row;
            var table = row.closest('table');
            var headers = table && table.tHead && table.tHead.rows[0] && table.tHead.rows[0].cells;
            if (!headers) return row.cells[row.cells.length - 1] || row;
            for (var i = 0; i < headers.length; i += 1) {
              if (headers[i].getAttribute('data-col-key') === 'Value') return row.cells[i] || row;
            }
            return row.cells[row.cells.length - 1] || row;
          }

          function clearFocusVisuals() {
            activeFocusToken += 1;
            if (activeFocusTimer) {
              clearTimeout(activeFocusTimer);
              activeFocusTimer = null;
            }
            Array.prototype.forEach.call(document.querySelectorAll('.json-focus-target'), function (item) {
              item.classList.remove('json-focus-target');
            });
            Array.prototype.forEach.call(document.querySelectorAll('.json-focus-row'), function (item) {
              item.classList.remove('json-focus-row');
            });
          }

          function highlightTarget(target, focusId) {
            installFocusStyle();
            clearFocusVisuals();
            var token = activeFocusToken;
            target.scrollIntoView({ block: 'center', inline: 'center' });
            var row = target.closest && target.closest('tr');
            if (row) row.classList.add('json-focus-row');
            target.classList.add('json-focus-target');
            activeFocusTimer = setTimeout(function () {
              if (token !== activeFocusToken) return;
              target.classList.remove('json-focus-target');
              if (row) row.classList.remove('json-focus-row');
              activeFocusTimer = null;
            }, 2200);
            parent.postMessage({ type: 'json-table-focus-result', ok: true, focusId: focusId, bridgeId: BRIDGE_ID }, '*');
            emitState('focused');
          }

          function rootFallbackTarget(path) {
            var select = document.getElementById('pathSelect');
            var selected = select && select.value;
            if (path !== selected) return null;
            return findTableByPath(path) || document.getElementById('content');
          }

          function focusPath(path, requestId, attempt, focusId) {
            if (requestId !== focusRequestId) return;
            attempt = attempt || 0;
            if (attempt > 8) {
              parent.postMessage({ type: 'json-table-focus-result', ok: false, focusId: focusId, bridgeId: BRIDGE_ID }, '*');
              return;
            }

            if (ensureRootForPath(path)) {
              setTimeout(function () { focusPath(path, requestId, attempt + 1, focusId); }, 140);
              return;
            }

            var target = findTarget(path) || rootFallbackTarget(path);
            if (!target) {
              restoreOpenPaths(ancestorPaths(path));
              setTimeout(function () { focusPath(path, requestId, attempt + 1, focusId); }, 120);
              return;
            }

            highlightTarget(target, focusId);
          }

          document.addEventListener('click', function (event) {
            var cell = event.target && event.target.closest && event.target.closest('td');
            if (!cell) return;
            var path = cellPath(cell);
            if (!path) return;
            parent.postMessage({ type: 'json-table-cell-click', path: path, bridgeId: BRIDGE_ID }, '*');
            scheduleEmitState();
          }, true);

          document.addEventListener('toggle', scheduleEmitState, true);
          document.addEventListener('change', scheduleEmitState, true);
          document.addEventListener('input', scheduleEmitState, true);
          var content = document.getElementById('content');
          if (content) content.addEventListener('scroll', scheduleEmitState, { passive: true });

          window.addEventListener('message', function (event) {
            var data = event.data || {};
            if (data.bridgeId && data.bridgeId !== BRIDGE_ID) return;
            if (data.type === 'json-table-restore-state') restoreState(data.state);
            if (data.type === 'json-table-focus-path') {
              focusRequestId += 1;
              focusPath(data.path, focusRequestId, 0, data.focusId);
            }
          });

          emitState('ready');
        })();
      <\/script>`;
    }

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.bridgeId && data.bridgeId !== previewBridgeId) return;
      if (data.type === 'json-table-state') {
        if (Date.now() < previewRestoringUntil && data.reason !== 'restored') return;
        previewState = data.state || previewState;
        if (data.reason === 'ready' || data.reason === 'restored') flushPreviewFocus();
        if (data.reason === 'restored') previewRestoringUntil = 0;
        return;
      }
      if (data.type === 'json-table-focus-result') {
        if (pendingPreviewFocus && data.focusId === pendingPreviewFocus.focusId && data.ok) {
          pendingPreviewFocus = null;
        }
        return;
      }
      if (data.type === 'json-table-cell-click' && data.path) {
        locateJsonPath(data.path);
      }
    });

    function renderNow(options = {}) {
      const replaceOnInvalid = options.replaceOnInvalid === true;
      const stateBeforeRender = hasRenderedPreview ? capturePreviewStateFromDom() : previewState;
      if (stateBeforeRender) previewState = stateBeforeRender;
      const responseText = input.value.trim();
      localStorage.setItem(STORAGE_KEY, input.value);

      if (!responseText) {
        setStatus('请输入 JSON', 'error');
        if (replaceOnInvalid || !hasRenderedPreview) errorPreview('请输入 JSON');
        return;
      }

      try {
        JSON.parse(responseText);
      } catch (err) {
        setStatus('JSON 解析失败，右侧保持上次有效表格', 'error');
        if (replaceOnInvalid || !hasRenderedPreview) {
          errorPreview(err && (err.message || String(err)));
        }
        return;
      }

      let capturedTemplate = '';
      let capturedData = { raw: responseText };
      const pm = {
        response: {
          text: () => responseText,
          json: () => JSON.parse(responseText)
        },
        visualizer: {
          set: (template, data) => {
            capturedTemplate = template;
            capturedData = data || { raw: responseText };
          }
        }
      };

      try {
        new Function('pm', visualizerScript)(pm);
        const raw = JSON.stringify(capturedData.raw || responseText).replace(/<\//g, '<\/');
        const pmShim = '<script>window.pm={getData:function(cb){cb(null,{raw:' + raw + '});}};<\/script>';
        const bridgeId = ++previewBridgeId;
        const stateToRestore = previewState && JSON.parse(JSON.stringify(previewState));
        previewRestoringUntil = stateToRestore ? Date.now() + 1200 : 0;
        preview.onload = () => restorePreviewState(stateToRestore, bridgeId);
        preview.srcdoc = pmShim + capturedTemplate + iframeBridgeScript(bridgeId);
        hasRenderedPreview = true;
        setStatus('已渲染 · ' + formatBytes(responseText), 'ok');
      } catch (err) {
        setStatus('渲染失败', 'error');
        errorPreview(err && (err.stack || err.message || String(err)));
      }
    }

    function scheduleRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderNow, 260);
    }

    document.getElementById('renderBtn').onclick = renderNow;
    document.getElementById('formatBtn').onclick = () => {
      try {
        input.value = JSON.stringify(JSON.parse(input.value), null, 2);
        renderNow();
      } catch (err) {
        setStatus('格式化失败：JSON 无效', 'error');
      }
    };
    document.getElementById('minifyBtn').onclick = () => {
      try {
        input.value = JSON.stringify(JSON.parse(input.value));
        renderNow();
      } catch (err) {
        setStatus('压缩失败：JSON 无效', 'error');
      }
    };
    document.getElementById('sampleBtn').onclick = () => {
      input.value = sampleJson;
      renderNow();
    };
    document.getElementById('clearBtn').onclick = () => {
      input.value = '';
      renderNow({ replaceOnInvalid: true });
      input.focus();
    };
    input.addEventListener('input', scheduleRender);
    input.addEventListener('click', () => {
      setTimeout(() => {
        const path = pathFromInputCursor();
        if (!path) return;
        focusPreviewPath(path);
        setStatus('右侧定位 · ' + path, 'ok');
      }, 0);
    });

    initInputPaneToggle();
    initSplitWidth();
    bindSplitResizer();
    input.value = localStorage.getItem(STORAGE_KEY) || sampleJson;
    renderNow();
  </script>
</body>
</html>
